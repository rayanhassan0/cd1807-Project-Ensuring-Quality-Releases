name: Azure Pipelines

trigger:
- main

# مثل زميلك: نستخدم اسم الـ pool مباشرة
pool: myAgentPool

variables:
  # ===== قيمك أنت =====
  python.version: '3.7.6'
  azureServiceConnectionId: 'udacity-az-sp'
  projectRoot: $(System.DefaultWorkingDirectory)
  environmentName: 'test'
  resourceGroup: 'Azuredevops'
  appServiceName: 'myapp-AppService'
  DEMO_URL: 'https://www.saucedemo.com/'

  # ===== Log Analytics (قيمك أنت) =====
  LOGTYPE: 'Selenium_Log'                  # الجدول = Selenium_Log_CL
  LAW_ID: 'da6e0b1f-7a68-4ef3-8b12-be42177ac070'
  LAW_KEY_B64: 'CTBND0JmLc1N+Dd4Po07MzVB/zvD4jVWtnLN41Ul0mCSeJqX9izqCNv4juji/zGLJY01vHkS48PpvHJZDfe45A=='

stages:
# ======================================================================
# BUILD
# ======================================================================
- stage: Build
  jobs:
  - job: BuildInfrastructure
    steps:
    # -------- Terraform --------
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
      displayName: 'Terraform installation'
      inputs:
        terraformVersion: '1.13.1'

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV3@3
      displayName: 'Terraform init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/test'
        backendServiceArm: '$(azureServiceConnectionId)'
        backendAzureRmResourceGroupName: '$(resourceGroup)'
        backendAzureRmStorageAccountName: 'tfstatebootstrap01'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'test.terraform.tfstate'
        backendAzureRmUseOidc: false
        backendAzureRmUseMsi: false

    # ✅ استيراد الموارد الموجودة مسبقًا (idempotent) بدل || true
    - task: AzureCLI@2
      displayName: 'TF import existing resources (one-time, idempotent)'
      inputs:
        azureSubscription: '$(azureServiceConnectionId)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          cd "$(System.DefaultWorkingDirectory)/terraform/environments/test"
          terraform init -reconfigure -input=false

          tf_has () { terraform state list | grep -qx "$1"; }
          import_if_needed () {
            local addr="$1" id="$2"
            if tf_has "$addr"; then
              echo "✅ already in state: $addr"
            else
              echo "↳ importing $addr"
              terraform import -input=false "$addr" "$id"
            fi
          }

          import_if_needed 'module.network.azurerm_virtual_network.vnet' \
            '/subscriptions/538cf8ed-3aac-4da8-84f9-3bc3a7a6869b/resourceGroups/Azuredevops/providers/Microsoft.Network/virtualNetworks/vnet-test'

          import_if_needed 'module.network.azurerm_subnet.subnet_test' \
            '/subscriptions/538cf8ed-3aac-4da8-84f9-3bc3a7a6869b/resourceGroups/Azuredevops/providers/Microsoft.Network/virtualNetworks/vnet-test/subnets/subnet-test'

          import_if_needed 'module.appservice.azurerm_service_plan.plan' \
            '/subscriptions/538cf8ed-3aac-4da8-84f9-3bc3a7a6869b/resourceGroups/Azuredevops/providers/Microsoft.Web/serverFarms/myapp-plan'

          echo "---- state after import ----"
          terraform state list || true

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV3@3
      displayName: 'Terraform validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/test'
        environmentServiceNameAzureRM: '$(azureServiceConnectionId)'

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV3@3
      displayName: 'Terraform apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/test'
        environmentServiceNameAzureRM: '$(azureServiceConnectionId)'

    # -------- Postman --------
    - task: CmdLine@2
      displayName: 'Install Newman'
      inputs:
        script: 'npm install -g newman'
        workingDirectory: $(System.DefaultWorkingDirectory)

    - task: CmdLine@2
      displayName: 'Run Data Validation Tests'
      continueOnError: true
      inputs:
        script: 'newman run TestSuite.Data-Validation.json -e Test.environment.json --reporters cli,junit --reporter-junit-export TEST-DataValidation.xml'
        workingDirectory: '$(System.DefaultWorkingDirectory)/automatedtesting/postman'

    - task: CmdLine@2
      displayName: 'Run Regression Tests'
      continueOnError: true
      inputs:
        script: 'newman run TestSuite.Regression.json -e Test.environment.json --reporters cli,junit --reporter-junit-export TEST-Regression.xml'
        workingDirectory: '$(System.DefaultWorkingDirectory)/automatedtesting/postman'

    - task: PublishTestResults@2
      displayName: 'Publish Postman JUnit Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/TEST-*.xml'
        searchFolder: '$(System.DefaultWorkingDirectory)/automatedtesting/postman'
        mergeTestResults: true
        testRunTitle: 'Postman Results'

    # -------- أرشفة ونشر الحِزم --------
    - task: ArchiveFiles@2
      displayName: 'Archive UI Tests'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/automatedtesting/selenium'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-uitests.zip'

    - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)-uitests.zip
      displayName: 'Upload UI Tests'
      artifact: drop-uitests

    - task: ArchiveFiles@2
      displayName: 'Archive FakeRestAPI'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/automatedtesting/jmeter/fakerestapi'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-fakerestapi.zip'

    - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)-fakerestapi.zip
      displayName: 'Upload FakeRestAPI'
      artifact: drop-fakerestapi

    - task: ArchiveFiles@2
      displayName: 'Archive PerformanceTestSuite'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/automatedtesting/jmeter'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-perftests.zip'

    - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)-perftests.zip
      displayName: 'Upload Perf Tests'
      artifact: drop-perftests

# ======================================================================
# DEPLOY
# ======================================================================
- stage: Deploy
  jobs:
  # ===== نشر الـ WebApp مثل زميلك =====
  - deployment: FakeRestAPI
    pool:
      name: 'myAgentPool'
    environment: '$(environmentName)'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy Azure Web App'
            inputs:
              azureSubscription: '$(azureServiceConnectionId)'
              appName: '$(appServiceName)'
              appType: webApp
              package: '$(Pipeline.Workspace)/drop-fakerestapi/$(Build.BuildId)-fakerestapi.zip'

          # JMeter على نفس أسلوب زميلك (Windows PowerShell)
          - task: PowerShell@2
            displayName: 'Run JMeter against App'
            inputs:
              targetType: 'inline'
              script: |
                $perfFolder = Join-Path "$(Pipeline.Workspace)" "perfrun"
                if (-not (Test-Path $perfFolder)) { New-Item -ItemType Directory -Path $perfFolder | Out-Null }
                Set-Location $perfFolder

                $jmVer = "5.6.3"
                $tgz = "apache-jmeter-$jmVer.tgz"
                Invoke-WebRequest -Uri "https://archive.apache.org/dist/jmeter/binaries/$tgz" -OutFile $tgz
                tar -xf $tgz
                $jm = Join-Path $perfFolder "apache-jmeter-$jmVer\bin\jmeter.bat"

                $zipPerf = Join-Path "$(Pipeline.Workspace)\drop-perftests" "$(Build.BuildId)-perftests.zip"
                Expand-Archive -Path $zipPerf -DestinationPath $perfFolder -Force

                $jmx = Join-Path $perfFolder "PerformanceTestSuite.jmx"
                if (-not (Test-Path $jmx)) { $jmx = Join-Path $perfFolder "Starter.jmx" }

                $appUrl = "https://$(appServiceName).azurewebsites.net"
                & $jm -n -t $jmx -JAPPSERVICEURL=$appUrl -l (Join-Path $perfFolder "results.jtl")
                Write-Host "JMeter finished."

  # ===== Selenium على VM + شحن السجلات للـ LAW بقيمك =====
  - deployment: VMDeploy
    displayName: 'Selenium Tests'
    environment:
      name: '$(environmentName)'
    pool:
      name: 'myAgentPool'
      resourceType: VirtualMachine
      tags: selenium
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop-uitests

          - task: PowerShell@2
            displayName: 'Run Selenium on Windows VM'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "Install Python deps"
                pip install --upgrade pip selenium webdriver-manager

                $testFolder = "$(Pipeline.Workspace)\uitests"
                if (-not (Test-Path $testFolder)) { New-Item -ItemType Directory -Path $testFolder | Out-Null }
                Expand-Archive "$(Pipeline.Workspace)\drop-uitests\$(Build.BuildId)-uitests.zip" -DestinationPath $testFolder -Force

                # تأكّد من وجود ChromeDriver
                $driverZip = Join-Path $testFolder "chromedriver_win32.zip"
                try {
                  $latest = Invoke-RestMethod "https://chromedriver.storage.googleapis.com/LATEST_RELEASE"
                  Invoke-WebRequest "https://chromedriver.storage.googleapis.com/$latest/chromedriver_win32.zip" -OutFile $driverZip
                  Expand-Archive $driverZip -DestinationPath $testFolder -Force
                  $env:PATH += ";$testFolder"
                } catch { Write-Host "Skip driver download: $_" }

                # شغّل سكربت الـUI (عدّل الاسم إذا يختلف)
                $logFile = Join-Path $testFolder "selenium.log"
                python "$testFolder\add_remove_from_cart.py" | Tee-Object -FilePath $logFile

                # ===== شحن السجلات إلى Log Analytics (قيمك) =====
                $lawId = "$(LAW_ID)"
                $keyB64 = "$(LAW_KEY_B64)"
                $logType = "$(LOGTYPE)"
                $computer = $env:COMPUTERNAME
                $nowUtc = [DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss")
                $buildId = "$(Build.BuildId)"

                if (-not (Test-Path $logFile)) { Set-Content -Path $logFile -Value "Selenium run complete" }

                $lines = Get-Content -Path $logFile
                $payload = @()
                foreach ($ln in $lines) {
                  $payload += @{
                    TimeGenerated = $nowUtc
                    RawData       = "UTC BuildId=$buildId $ln"
                    Computer      = $computer
                  }
                }
                $json = ($payload | ConvertTo-Json -Depth 5)

                $rfcDate = [DateTime]::UtcNow.ToString("r")
                $resource = "/api/logs"
                $url = "https://$lawId.ods.opinsights.azure.com$resource?api-version=2016-04-01"
                $bytes = [Text.Encoding]::UTF8.GetBytes($json)
                $contentLength = $bytes.Length
                $toSign = "POST`n$contentLength`napplication/json`nx-ms-date:$rfcDate`n$resource"
                $key = [Convert]::FromBase64String($keyB64)
                $hmac = New-Object System.Security.Cryptography.HMACSHA256($key)
                $hash = $hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($toSign))
                $sig = [Convert]::ToBase64String($hash)
                $auth = "SharedKey $lawId:$sig"

                $resp = Invoke-WebRequest -Method Post -Uri $url -Headers @{
                  "Content-Type"         = "application/json"
                  "Log-Type"             = $logType
                  "x-ms-date"            = $rfcDate
                  "time-generated-field" = "TimeGenerated"
                  "Authorization"        = $auth
                } -Body $json -UseBasicParsing
                Write-Host "LA status: $($resp.StatusCode)"
